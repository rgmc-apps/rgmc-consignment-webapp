worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Use /tmp for writable paths (Cloud Run runs as non-root)
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;

    # DNS resolver required for proxy_pass to external HTTPS upstreams
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    server {
        listen ${PORT};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options       "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

        # Proxy /bc/* and /internal/* to the BC API — target set at runtime from $VITE_API_BASE_URL
        location /bc/ {
            proxy_pass            ${VITE_API_BASE_URL};
            proxy_http_version    1.1;
            proxy_set_header      Host              $proxy_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_read_timeout    200s;
            proxy_connect_timeout 10s;
        }

        location /internal/ {
            proxy_pass            ${VITE_API_BASE_URL};
            proxy_http_version    1.1;
            proxy_set_header      Host              $proxy_host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_read_timeout    200s;
            proxy_connect_timeout 10s;
        }

        # Service worker and manifest must never be cached (browser checks for SW updates)
        location ~* "^/(sw\.js|manifest\.webmanifest|registerSW\.js)$" {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Cache hashed assets forever — match on /assets/ directory, not hash
        # format, because Vite uses base62 hashes (e.g. DXk9268u) not pure hex.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback — serve index.html for all unknown paths
        # Cache-Control headers repeated here because nginx add_header does not
        # inherit from parent blocks once a location has its own add_header.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Frame-Options       "SAMEORIGIN"   always;
            add_header X-Content-Type-Options "nosniff"     always;
            add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
        }
    }
}
